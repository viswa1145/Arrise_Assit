name: terraform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - task1-ec2
          - task2-state-backend
          - task3-iam
          - task5-bugfix
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: fmt
        run: terraform fmt -check -recursive -diff

      # -backend=false: static checks need no AWS credentials or state access.
      - name: init
        run: terraform init -backend=false -input=false

      - name: validate
        run: terraform validate -no-color

      - uses: terraform-linters/setup-tflint@v4
      - name: tflint
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --config "$GITHUB_WORKSPACE/.tflint.hcl" --recursive --format compact

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          config_file: .checkov.yaml

  # `terraform plan` against real accounts belongs in a separate job that
  # assumes a read-only plan role via GitHub OIDC (no stored AWS keys), and
  # `apply` behind a protected environment with required reviewers.
