framework:
  - terraform
compact: true
quiet: true

# Repo-wide skips are limited to features out of scope for this assignment.
# Resource-specific exceptions are inline (#checkov:skip) next to the code.
skip-check:
  # S3 access logging / cross-region replication: needs a separate log
  # bucket and a second region, out of scope for this assignment.
  - CKV_AWS_18
  - CKV_AWS_144
  # S3 event notifications: not needed for a state/data bucket here.
  - CKV2_AWS_62
  # Buckets use SSE-KMS with the AWS-managed key; a CMK is an optional
  # upgrade (ebs_kms_key_id is already supported for EC2).
  - CKV_AWS_145
  - CKV_AWS_119
